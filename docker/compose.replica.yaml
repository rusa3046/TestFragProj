# A primary and a streaming replica, for watching lag and failing over.
#
#   docker compose -f docker/compose.replica.yaml up -d
#   psql -h localhost -p 5432 -U postgres -c "SELECT * FROM pg_stat_replication;"
#   psql -h localhost -p 5433 -U postgres -c "SELECT pg_is_in_recovery();"
#
# The replica is read-only: a write against port 5433 fails, which is the
# first thing worth confirming by hand.
services:
  primary:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fragrance_graph_scale
      # wal_level=replica and a slot are what make the primary keep WAL
      # a disconnected replica still needs. A slot also means the primary
      # will fill its own disk rather than let the replica fall behind
      # permanently -- the trade nobody mentions until it happens.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: >-
      postgres -c wal_level=replica -c max_wal_senders=4
               -c max_replication_slots=4 -c hot_standby=on
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  replica:
    image: postgres:16
    depends_on:
      primary: {condition: service_healthy}
    environment:
      PGPASSWORD: postgres
    ports: ["5433:5432"]
    # pg_basebackup clones the primary, then the container starts in
    # recovery and streams. Running it in the entrypoint keeps the whole
    # setup in one file rather than in a README nobody re-reads.
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          rm -rf /var/lib/postgresql/data/*
          pg_basebackup -h primary -U postgres -D /var/lib/postgresql/data \
            -Fp -Xs -R -P
          chmod 700 /var/lib/postgresql/data
        fi
        exec docker-entrypoint.sh postgres
    user: postgres
