# The loop, running without anyone watching.
#
# `daily.py` was written for this and had never been scheduled: budget.py
# assumes "each scheduled run gets a fresh container: the repository is
# cloned, the database is rebuilt from data/corpus/", which is exactly what
# happens below. Until this file existed, every run was a person typing.
#
# Two decisions are encoded here rather than in the code.
#
# **No catalogue lookups.** Measured 2026-08-12: 60 lookups converted 5
# names, because the catalogue does not carry the small-house bottles this
# corpus discusses. Lookups stay manual and occasional, so an unattended run
# cannot spend on an 8% yield. See SPEC.
#
# **Silence unless a person is needed.** A run that collected comments and
# published nothing is not news. The issue below opens only when curation
# is holding rows or something failed — the two cases where the loop is
# genuinely waiting on a human.
name: fragrance-graph

on:
  schedule:
    # Mondays and Thursdays, 06:00 UTC. Cron here is always UTC.
    - cron: "0 6 * * 1,4"
  workflow_dispatch:        # and a button, for running it by hand

permissions:
  contents: write           # commits the corpus back
  issues: write             # opens the one issue that asks for a decision
  pages: write              # publishes the built pages
  id-token: write           # required by deploy-pages

concurrency:
  # Two runs at once would both rebuild from the corpus, both extract, and
  # the second would overwrite the first's commit. The ledger would also
  # be read twice before either wrote, handing out the cap twice.
  group: fragrance-graph-loop
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level, so every step reads and writes the *same* database.
    # Setting it only on the step that runs the loop meant the rebuild
    # populated one database while the loop read another, so the loop ran
    # against an empty one: no fragrances, nothing resolvable, and an
    # export that would have committed a corpus with 65 hand labels and
    # 56 curated bottles deleted. The export guard refused it, which is
    # the only reason that was a wasted run rather than a destroyed
    # corpus.
    env:
      FRAGRANCE_DB_URL: postgresql://postgres:postgres@localhost:5432/fragrance_graph
    # A throwaway server for the length of the run. The database is
    # derived: `corpus import` rebuilds it from the committed JSONL in
    # seconds, and nothing in it outlives the job. Which is why no volume
    # is mounted and no backup exists — the corpus *is* the backup.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fragrance_graph
        ports:
          - 5432:5432
        # Without this the first step races the server's startup and
        # fails with "connection refused" perhaps one run in five, which
        # is the worst possible failure rate: too rare to fix, too common
        # to trust.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --extra dev

      - name: Rebuild the database from the committed corpus
        run: |
          uv run python -m fragrance_graph.db init
          uv run python -m fragrance_graph.corpus import

      - name: Check the rebuild actually landed
        # An import into the wrong database reports success just as
        # cheerfully, so "import succeeded" is not evidence the loop will
        # see the data. This asserts the corpus is where the loop reads.
        run: |
          uv run python -c "
          import sys

          import psycopg

          from fragrance_graph.db import get_connection
          try:
              c = get_connection()
              n = c.execute('select count(*) from fragrances').fetchone()[0]
              labels = c.execute('select count(*) from eval_labels').fetchone()[0]
          except (psycopg.OperationalError, psycopg.errors.UndefinedTable) as exc:
              sys.exit(f'Rebuild did not land ({exc}). '
                       'The import step wrote somewhere else — check '
                       'FRAGRANCE_DB_URL is set for every step.')
          print(f'{n} fragrances, {labels} eval labels')
          if not n:
              sys.exit('Rebuild did not land: no fragrances. Refusing to run '
                       'the loop against an empty database.')
          "

      - name: Run the loop
        id: loop
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FRAGRANCE_ANTHROPIC_API_KEY: ${{ secrets.FRAGRANCE_ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          # No --queries: the seeds live in `daily.SEED_QUERIES`, where
          # they are documented, shape-checked by a test, and reviewable
          # in a diff. Six of the eight queries this step used to inline
          # contained "dupe", which is a leading question asked of an
          # audience assembled to answer it.
          uv run python -m fragrance_graph.daily run \
            --lookup-limit 0 \
            2>&1 | tee run.log
          {
            echo '## Loop report'
            echo '```'
            tail -40 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export the corpus
        run: uv run python -m fragrance_graph.corpus export

      - name: Commit anything new
        run: |
          git config user.name  "fragrance-graph bot"
          git config user.email "noreply@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing new" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Scheduled run: $(date -u +%Y-%m-%d)"
            # Rebase rather than force: a person may have curated by hand
            # since the last run, and their work outranks this one's.
            git pull --rebase --autostash
            git push
          fi

      - name: Build the pages
        # Explicit rather than relying on the loop having reached its own
        # build step: `run` returns early when the day's cap is already
        # spent, and the published site should still reflect the corpus
        # even on a run that did no new work. Costs nothing — pages are
        # pure derivation from the database.
        # `--base-url` is what canonical tags and sitemap.xml are built
        # from. It is the Pages URL GitHub derives from the repository,
        # so it stays right if the repo is renamed; a `CNAME` file in the
        # repo root overrides it, and `build` copies that file into the
        # artifact so a custom domain survives every deploy.
        run: |
          uv run python -m fragrance_graph.pages build --out site \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Package the pages
        # `site/` is gitignored on purpose — pages cost no quota, no money
        # and no judgement, so they are rebuilt rather than stored. Which
        # makes an artifact exactly right: published, never committed.
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Ask for a decision, only if one is needed
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('run.log')
              ? fs.readFileSync('run.log', 'utf8') : '';
            const failed = '${{ job.status }}' !== 'success';
            const problems = /^Problems:/m.test(log);
            const held = /^Held for you \((\d+)\)/m.exec(log);
            if (!failed && !problems && !held) return;   // nothing to say

            const title = 'Loop needs a decision';
            const body = [
              failed ? '**The run failed.** See the Actions log.' : '',
              held ? `**${held[1]} names are held** — the catalogue offered `
                   + 'something with a flanker question in it, which only a '
                   + 'person can settle.\n\n```\nuv run python -m '
                   + 'fragrance_graph.daily curate\n```' : '',
              problems ? 'The run reported problems:' : '',
              '```', log.split('\n').slice(-45).join('\n'), '```',
            ].filter(Boolean).join('\n\n');

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'loop',
            });
            if (open.data.length) {
              // One issue, updated. A new issue per run would train you to
              // ignore the notification, which defeats the point of it.
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['loop'],
              });
            }

  publish:
    # Separate job because `needs` gives the guarantee that matters: a run
    # that failed — or one whose export was refused — never reaches this,
    # so the live site cannot be replaced by the output of a broken run.
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
